
buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:7.4.2")
    }
}

apply plugin: 'com.android.library'

android {
    namespace "com.fibricheck.rncamerasdk"
    compileSdkVersion 34
    buildToolsVersion "34.0.0"

    defaultConfig {
        minSdkVersion 24
        targetSdkVersion 34
        versionCode 2
        versionName "1.3.4"
    }
    lintOptions {
        abortOnError false
    }
    compileOptions {
        sourceCompatibility = 1.8
        targetCompatibility = 1.8
    }
}

repositories {
    mavenCentral()
    google()
    maven { url 'https://jitpack.io' }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])
    implementation 'com.github.fibricheck:android-camera-sdk:a04e0810e885f0ba1de0a6c1150efa6018d4c46e'
    implementation 'com.facebook.react:react-native:+'
    implementation 'com.google.code.gson:gson:2.11.0'
}
