name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 1.2.0)"
        required: true
        type: string
      target_branch:
        description: "Branch to open the PR against (e.g. master, v1.2.3)"
        required: false
        default: "master"
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.target_branch }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Compute changelog range
        id: range
        run: |
          LAST_RELEASE=$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          echo "value=${LAST_RELEASE:+${LAST_RELEASE}..}HEAD" >> $GITHUB_OUTPUT

      - name: Ensure CHANGELOG.md exists
        run: touch CHANGELOG.md

      - name: Remove existing entry for this version
        run: |
          awk -v ver='${{ inputs.version }}' '/^## \[/{skip=index($0,"["ver"]")>0} skip{next} 1' CHANGELOG.md > CHANGELOG.tmp && mv CHANGELOG.tmp CHANGELOG.md

      - name: Generate changelog
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v4.8.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          config: cliff.toml
          args: --tag v${{ inputs.version }} --prepend CHANGELOG.md ${{ steps.range.outputs.value }}

      - name: Generate release notes
        id: release-notes
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v4.8.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          config: cliff.toml
          args: --tag v${{ inputs.version }} --strip all ${{ steps.range.outputs.value }}

      - name: Update sdk-release.json
        run: |
          jq --arg version "${{ inputs.version }}" \
             --arg date "$(date -u +%Y-%m-%d)" \
             '.version = $version | .releaseDate = $date' \
             sdk-release.json > sdk-release.json.tmp
          mv sdk-release.json.tmp sdk-release.json

      - name: Update package.json and package-version.json
        run: |
          jq --arg version "${{ inputs.version }}" '.version = $version' \
            package.json > package.json.tmp
          mv package.json.tmp package.json
          jq '{version}' package.json > package-version.json

      - name: Create release branch and PR
        run: |
          BRANCH="chore/release-v${{ inputs.version }}-$(date -u +%Y-%m-%d)"
          git checkout -b "$BRANCH"
          git add CHANGELOG.md sdk-release.json package.json package-version.json
          git commit -m "chore: Release v${{ inputs.version }}"
          git push origin "$BRANCH"

          {
            echo "Updates the changelog and release metadata for **v${{ inputs.version }}**. After merging, you can trigger the release manually via the Deploy workflow."
            echo ""
            echo "${{ steps.release-notes.outputs.content }}"
          } > pr_body.md

          gh pr create \
            --title "chore(release): v${{ inputs.version }}" \
            --body-file pr_body.md \
            --base "${{ inputs.target_branch }}" \
            --head "$BRANCH" \
          || echo "PR already exists, skipping creation"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
